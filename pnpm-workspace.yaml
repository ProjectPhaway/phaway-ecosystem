packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 bloquea scripts de instalacion por defecto. Solo se permiten estos (oficiales / nativos conocidos).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  # Telemetria anonima que algunos paquetes inyectan (lo pulled en transitivo
  # @nestjs/swagger -> @scarf/scarf). No lo necesitamos, se bloquea.
  '@scarf/scarf': false
  bcrypt: true
  esbuild: true
  prisma: true
